[package]
name = "falkeai-core"
version = "1.0.0"
edition = "2021"
description = "FalkeAI: Falcon's personal AI representative, Aurikrex assistant, and group moderator (Rust Core + Go whatsmeow Bridge + Turso)"

[[bin]]
name = "falkeai-core"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
hex = "0.4"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

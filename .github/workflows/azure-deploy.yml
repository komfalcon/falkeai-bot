name: Build & Push FalkeAI Container (Azure Ready)

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract lowercase image name
        id: meta
        run: |
          IMAGE_ID=$(echo "ghcr.io/${{ github.repository_owner }}/falkeai-bot" | tr '[:upper:]' '[:lower:]')
          echo "image_id=$IMAGE_ID" >> $GITHUB_OUTPUT

      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image_id }}:latest
            ${{ steps.meta.outputs.image_id }}:${{ github.sha }}

name: Build Linux Binaries for FalkeAI

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build Go whatsmeow bridge (wa-bridge)
        working-directory: bridge
        run: |
          go get github.com/mattn/go-sqlite3@latest
          go get go.mau.fi/whatsmeow@latest
          go get google.golang.org/protobuf@latest
          go mod tidy
          CGO_ENABLED=1 GOOS=linux go build -ldflags="-s -w" -o ../wa-bridge .

      - name: Build Rust Core (falkeai-core)
        run: |
          cargo build --release
          cp target/release/falkeai-core ./falkeai-core

      - name: Publish binaries to 'latest' GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ./falkeai-core ./wa-bridge \
            --title "FalkeAI Latest Linux Binaries" \
            --notes "Prebuilt Linux x86_64 binaries (falkeai-core + wa-bridge)"
